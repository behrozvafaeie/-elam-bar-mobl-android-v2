name: Android APK
on:
  push:
    branches: [ "main", "stable/base-run-165", "work/source-166", "work/source-184", "work/source-185", "work/source-186", "work/release-hardening-1.0.22", "fix/driver-available-loads-filter", "design/tarp-truck-menu-v1-0-24", "feature/confirmed-user-rules-v1-0-25", "fix/source-343-stabilization", "stable/source-343-baseline", "fix/post-merge-ci-stabilization", "feature/v1.5.1-load-draft-autosave", "release/v1.5.1-clean-candidate", "fix/v1.5.1-apk-install-compat", "feature/v1.5.1.1-advanced-load-panel" ]
    paths:
      - "app/**"
      - "supabase/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [ "fix/v1.5.1-apk-install-compat" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: android-debug-keystore-v2-Linux

      - name: Create stable debug signing key when cache is empty
        shell: bash
        run: |
          mkdir -p /home/runner/.android
          if [ ! -s /home/runner/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore /home/runner/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s /home/runner/.android/debug.keystore

      - name: Verify package identity and version
        shell: bash
        run: |
          grep -F 'applicationId = "ir.elambar.mobl"' app/build.gradle.kts
          grep -F 'versionCode = 29' app/build.gradle.kts
          grep -F 'versionName = "1.5.1.1"' app/build.gradle.kts
          ! grep -E 'ELAM_TURN_(URL|USERNAME|PASSWORD)' .github/workflows/android-apk.yml

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK was produced
        shell: bash
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK package metadata, alignment and signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='ir.elambar.mobl' versionCode='28' versionName='1.5.1.1'"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          du -h "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elam-bar-mobl-v1.5.1.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  emulator-smoke-test:
    name: Emulator install and launch test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: elam-bar-mobl-v1.5.1.1-debug-apk
          path: artifacts

      - name: Install and launch APK on Android emulator
        timeout-minutes: 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 4096 -cores 2 -no-metrics
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb shell pm list packages >/dev/null
            echo "Installing APK without streamed transfer..."
            adb install --no-streaming -r artifacts/app-debug.apk
            echo "Launching app..."
            adb shell am force-stop ir.elambar.mobl
            adb shell monkey -p ir.elambar.mobl 1
            sleep 10
            adb shell pidof ir.elambar.mobl | grep -E '[0-9]+'
            if adb logcat -d | grep -E -A 25 -B 5 "FATAL EXCEPTION.*ir.elambar.mobl|Process: ir.elambar.mobl"; then
              echo "Fatal crash detected."
              exit 1
            fi
