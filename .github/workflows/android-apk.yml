name: Android APK
on:
  push:
    branches: [ "main", "stable/base-run-165", "work/source-166", "work/source-184", "work/source-185", "work/source-186", "work/release-hardening-1.0.22", "fix/driver-available-loads-filter", "design/tarp-truck-menu-v1-0-24", "feature/confirmed-user-rules-v1-0-25", "fix/source-343-stabilization", "stable/source-343-baseline", "fix/post-merge-ci-stabilization", "feature/v1.5.1-load-draft-autosave", "release/v1.5.1-clean-candidate", "fix/load-status-edit-delete-logout-v1" ]
    paths:
      - "app/**"
      - "supabase/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: android-debug-keystore-v3-Linux

      - name: Create stable debug signing key when cache is empty
        shell: bash
        run: |
          mkdir -p /home/runner/.android
          if [ ! -s /home/runner/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore /home/runner/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s /home/runner/.android/debug.keystore

      - name: Verify package identity and version
        shell: bash
        run: |
          grep -F 'applicationId = "ir.elambar.mobl"' app/build.gradle.kts
          grep -F 'versionCode = 33' app/build.gradle.kts
          grep -F 'versionName = "1.5.7"' app/build.gradle.kts
          ! grep -E 'ELAM_TURN_(URL|USERNAME|PASSWORD)' .github/workflows/android-apk.yml

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Re-sign APK with the persistent CI key
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIGNED=app/build/outputs/apk/debug/app-debug-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /home/runner/.android/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" "$APK"
          mv "$SIGNED" "$APK"

      - name: Verify APK was produced
        shell: bash
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK package metadata and signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='ir.elambar.mobl' versionCode='33' versionName='1.5.7'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs --verbose "$APK"
          keytool -list -v -keystore /home/runner/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:"
          sha256sum "$APK"
          du -h "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elam-bar-mobl-v1.5.7-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  emulator-smoke-test:
    name: Optional emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 22
    continue-on-error: true
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: elam-bar-mobl-v1.5.7-debug-apk
          path: artifacts

      - name: Install and launch APK on Android emulator
        timeout-minutes: 18
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 3072 -cores 2 -no-metrics
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -eu; echo "Waiting for Android device..."; adb wait-for-device; echo "Waiting for Android package manager..."; ready=0; for i in $(seq 1 36); do if timeout 15s adb shell pm list packages >/dev/null 2>&1; then ready=1; break; fi; echo "Package manager not ready ($i/36)"; sleep 5; done; test "$ready" -eq 1; echo "Installing APK with retry..."; installed=0; for i in 1 2 3; do if timeout 180s adb install -r artifacts/app-debug.apk; then installed=1; break; fi; echo "Install attempt $i failed; reconnecting ADB"; adb reconnect || true; sleep 10; done; test "$installed" -eq 1; echo "Launching app..."; timeout 60s adb shell am force-stop ir.elambar.mobl; timeout 60s adb shell monkey -p ir.elambar.mobl 1; sleep 15; echo "Checking app process..."; timeout 30s adb shell pidof ir.elambar.mobl | grep -E '[0-9]+'; echo "Checking foreground activity..."; timeout 30s adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -n 2; echo "Checking app-specific fatal crashes..."; if timeout 30s adb logcat -d | grep -E -A 25 -B 5 "FATAL EXCEPTION.*ir.elambar.mobl|Process: ir.elambar.mobl"; then echo "Fatal crash detected."; exit 1; fi
# Emulator smoke-test script is intentionally a single shell line for the runner.
