name: Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: android-debug-keystore-v2-Linux
      - name: Create stable debug signing key when cache is empty
        shell: bash
        run: |
          mkdir -p /home/runner/.android
          if [ ! -s /home/runner/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore /home/runner/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s /home/runner/.android/debug.keystore
      - name: Verify package identity and version
        shell: bash
        run: |
          grep -F 'applicationId = "ir.elambar.mobl"' app/build.gradle.kts
          grep -F 'versionCode = 6' app/build.gradle.kts
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK was produced
        shell: bash
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elam-bar-mobl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
