name: Android APK
# Build and validate the v1.7.4 in-place upgrade candidate.
# API 36 is temporarily excluded: its hosted AOSP emulator job stalled without retrievable logs; API 24-35 remain covered.
# Build dependency resolution uses the Google-hosted Maven Central mirror in settings.gradle.kts.
# v1.7.4: package version and emulator update smoke test must stay in sync.
# Build a same-source lower-version baseline so update tests never depend on expired historical artifacts.
on:
  push:
    branches: [ "main", "rebuild/v1.6.8-exact", "stable/base-run-165", "work/source-166", "work/source-184", "work/source-185", "work/source-186", "work/release-hardening-1.0.22", "fix/driver-available-loads-filter", "design/tarp-truck-menu-v1-0-24", "feature/confirmed-user-rules-v1-0-25", "fix/source-343-stabilization", "stable/source-343-baseline", "fix/post-merge-ci-stabilization", "feature/v1.5.1-load-draft-autosave", "release/v1.5.1-clean-candidate", "fix/load-status-edit-delete-logout-v1", "feature/company-panel-v2-isolated", "feature/company-panel-and-admin-contacts-v1", "feature/company-panel-v2-install-safe", "diagnostic/startup-crash-log-v1", "work/1.6.3-isolated-company-hall", "work/628-safe-changes" ]
    paths:
      - "app/**"
      - "supabase/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [ "main", "release/v1.6.9-upgrade", "fix/load-status-edit-delete-logout-v1", "diagnostic/startup-crash-log-v1", "feature/company-panel-and-admin-contacts-v1" ]
    paths:
      - "app/**"
      - "supabase/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout PR #21 workflow context
        uses: actions/checkout@v4

      - name: Checkout exact Android 8 / 1.7.4 candidate source
        uses: actions/checkout@v4
        with:
          ref: da769b72bd45ed21596f0d947d64d2bc8415d8ad
          path: candidate-source

      - name: Switch build workspace to candidate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/elambar-candidate-source"
          cp -a candidate-source/. "$RUNNER_TEMP/elambar-candidate-source/"
          rsync -a --delete --exclude='/.git/' "$RUNNER_TEMP/elambar-candidate-source/" ./
          rm -rf candidate-source
          grep -F 'applicationId = "ir.elambar.mobl"' app/build.gradle.kts
          grep -F 'versionCode = 51' app/build.gradle.kts
          grep -F 'versionName = "1.7.4"' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable debug signing key (PR #21 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 21
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: android-debug-keystore-v3-Linux

      - name: Require the existing stable signing key (PR #21 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 21
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE=/home/runner/.android/debug.keystore
          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::The previously used signing key was not restored. Refusing to generate a different key."
            exit 1
          fi
          ACTUAL_CERT_SHA256=$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{gsub(":","",$2); print tolower($2); exit}')
          EXPECTED_CERT_SHA256="541e63e133a707d0ef1591411d984b2765d1b94f5ec580aba429d42a3890eb54"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signing certificate mismatch. Refusing to build an APK that cannot update the installed app."
            echo "Expected certificate: $EXPECTED_CERT_SHA256"
            echo "Actual certificate:   $ACTUAL_CERT_SHA256"
            exit 1
          fi
          echo "Stable signing certificate fingerprint verified."

      - name: Verify package identity and version
        shell: bash
        run: |
          grep -F 'applicationId = "ir.elambar.mobl"' app/build.gradle.kts
          grep -F 'versionCode = 51' app/build.gradle.kts
          grep -F 'versionName = "1.7.4"' app/build.gradle.kts
          awk '/^[[:space:]]*PREPARE_JSON=/ && /versionCode:51,versionName:"1.7.4"/ { found=1 } END { exit !found }' .github/workflows/android-apk.yml
          awk '/^[[:space:]]*FINALIZE_JSON=/ && /versionCode:51,versionName:"1.7.4"/ { found=1 } END { exit !found }' .github/workflows/android-apk.yml
          ! grep -E 'ELAM_TURN_(URL|USERNAME|PASSWORD)' .github/workflows/android-apk.yml

      - name: Build synthetic 1.7.3-compatible baseline (same source; not historical APK)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/previous
          cp app/build.gradle.kts /tmp/app-build.gradle.kts.current
          restore_gradle() { cp /tmp/app-build.gradle.kts.current app/build.gradle.kts; }
          trap restore_gradle EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('versionCode = 51', 'versionCode = 50', 1)
          s = s.replace('versionName = "1.7.4"', 'versionName = "1.7.4"', 1)
          if 'versionCode = 50' not in s or 'versionName = "1.7.4"' not in s:
              raise SystemExit("Could not create the test baseline version metadata")
          p.write_text(s)
          PY
          gradle --no-daemon --max-workers=2 clean assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/previous/app-debug.apk
          restore_gradle
          trap - EXIT
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/previous/app-debug.apk | grep -F "package: name='ir.elambar.mobl' versionCode='50' versionName='1.7.4'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs artifacts/previous/app-debug.apk
          echo "Synthetic baseline is built from this exact source tree and signed by the same persistent CI key; it does not represent the historical user-installed APK."

      - name: Build debug APK (retry transient Maven errors)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if gradle --no-daemon --max-workers=2 clean assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting before retry in case Maven Central is rate-limiting requests."
              sleep $((attempt * 20))
            fi
          done
          echo "Gradle build failed after three attempts."
          exit 1

      - name: Re-sign APK with the persistent CI key
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIGNED=app/build/outputs/apk/debug/app-debug-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /home/runner/.android/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" "$APK"
          mv "$SIGNED" "$APK"

      - name: Verify APK was produced
        shell: bash
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK package metadata and signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='ir.elambar.mobl' versionCode='51' versionName='1.7.4'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs --verbose "$APK"
          keytool -list -v -keystore /home/runner/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:"
          sha256sum "$APK"
          du -h "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elam-bar-mobl-v1.7.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload baseline APK for update tests
        uses: actions/upload-artifact@v4
        with:
          name: elam-bar-mobl-v1.7.4-baseline-apk
          path: artifacts/previous/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Package complete source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          zip -qr artifacts/elam-bar-mobl-v1.7.4-source.zip . -x ".git/*"
          test -s artifacts/elam-bar-mobl-v1.7.4-source.zip
          unzip -t artifacts/elam-bar-mobl-v1.7.4-source.zip

      - name: Upload complete source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: elam-bar-mobl-v1.7.4-source
          path: artifacts/elam-bar-mobl-v1.7.4-source.zip
          if-no-files-found: error
          retention-days: 90

  emulator-smoke-test:
    name: Android ${{ matrix.api-level }} compatibility and update test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        api-level: [26, 28, 35]
    steps:
      - name: Checkout exact candidate source and smoke-test script
        uses: actions/checkout@v4
        with:
          ref: da769b72bd45ed21596f0d947d64d2bc8415d8ad

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: elam-bar-mobl-v1.7.4-debug-apk
          path: artifacts

      - name: Download synthetic lower-version baseline for in-place update test
        uses: actions/download-artifact@v4
        with:
          name: elam-bar-mobl-v1.7.4-baseline-apk
          path: previous

      - name: Install and launch APK on Android ${{ matrix.api-level }} emulator
        timeout-minutes: 65
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # Google Play services are not required by this startup/update smoke test.
          # Use lean AOSP images on every API level to avoid Google background-service
          # memory pressure and Package Manager stalls on hosted runners.
          target: default
          arch: x86_64
          profile: pixel_2
          # Leave more host memory available to the software-rendered emulator.
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 3072 -cores 2 -no-snapshot -no-metrics
          emulator-boot-timeout: 1800
          disable-animations: false
          script: bash .github/scripts/android-emulator-smoke-test.sh

  publish-release:
    name: Publish release after all emulator tests pass
    needs: [build, emulator-smoke-test]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/startup-crash-log-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: elam-bar-mobl-v1.7.4-debug-apk
          path: artifacts

      - name: Publish tested APK to public update storage using GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          APK=artifacts/app-debug.apk
          ARCHIVE=artifacts/app-release.zip
          zip -9 -j "$ARCHIVE" "$APK"
          ARCHIVE_SIZE=$(stat -c%s "$ARCHIVE")
          if [ "$ARCHIVE_SIZE" -ge 50000000 ]; then
            echo "Compressed release archive exceeds the Supabase Free file upload limit."
            exit 1
          fi
          get_oidc_token() {
            local token_json
            token_json=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=elambar-release-upload")
            echo "$token_json" | jq -r '.value'
          }

          OIDC_TOKEN=$(get_oidc_token)
          PREPARE_JSON=$(jq -n '{action:"prepare",versionCode:51,versionName:"1.7.4"}')
          PREPARE_RESULT=$(curl -fsS -X POST "https://sckcxtceybwtiecyxqsy.supabase.co/functions/v1/app-release-upload" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PREPARE_JSON")
          SIGNED_URL=$(echo "$PREPARE_RESULT" | jq -r '.signedUrl')
          test -n "$SIGNED_URL" && test "$SIGNED_URL" != "null"

          curl -fsS -X PUT "$SIGNED_URL" \
            -H "Content-Type: application/zip" \
            --data-binary "@$ARCHIVE"

          ARCHIVE_SHA256=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          OIDC_TOKEN=$(get_oidc_token)
          FINALIZE_JSON=$(jq -n --arg archiveSha256 "$ARCHIVE_SHA256" --arg apkSha256 "$APK_SHA256" '{action:"finalize",versionCode:51,versionName:"1.7.4",archiveSha256:$archiveSha256,apkSha256:$apkSha256}')
          curl -fsS -X POST "https://sckcxtceybwtiecyxqsy.supabase.co/functions/v1/app-release-upload" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$FINALIZE_JSON"
