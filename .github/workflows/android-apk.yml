name: Android APK
on:
  push:
    branches: [ "main", "stable/base-run-165", "work/source-166", "work/source-184", "work/source-185", "work/source-186", "work/release-hardening-1.0.22" ]
    paths:
      - "app/**"
      - "supabase/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: android-debug-keystore-v2-Linux

      - name: Create stable debug signing key when cache is empty
        shell: bash
        run: |
          mkdir -p /home/runner/.android
          if [ ! -s /home/runner/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore /home/runner/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s /home/runner/.android/debug.keystore

      - name: Verify package identity and version
        shell: bash
        run: |
          grep -F 'applicationId = "ir.elambar.mobl"' app/build.gradle.kts
          grep -F 'versionCode = 24' app/build.gradle.kts
          grep -F 'versionName = "1.0.23"' app/build.gradle.kts

      - name: Build debug APK
        env:
          ELAM_TURN_URL: ${{ secrets.ELAM_TURN_URL }}
          ELAM_TURN_USERNAME: ${{ secrets.ELAM_TURN_USERNAME }}
          ELAM_TURN_PASSWORD: ${{ secrets.ELAM_TURN_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Verify APK was produced
        shell: bash
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK package metadata and signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='ir.elambar.mobl' versionCode='24' versionName='1.0.23'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elam-bar-mobl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  emulator-smoke-test:
    name: Optional emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 22
    continue-on-error: true
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: elam-bar-mobl-debug-apk
          path: artifacts

      - name: Install and launch APK on Android emulator
        timeout-minutes: 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 4096 -cores 2 -no-metrics
          emulator-boot-timeout: 480
          script: |
            set -e
            adb wait-for-device
            echo "Waiting for Android boot completion..."
            booted=0
            for attempt in $(seq 1 90); do
              state=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$state" = "1" ]; then booted=1; break; fi
              sleep 3
            done
            test "$booted" = "1"
            echo "Installing APK without streaming (more reliable on software emulators)..."
            installed=0
            for attempt in 1 2 3; do
              if adb install --no-streaming -r artifacts/app-debug.apk; then installed=1; break; fi
              echo "Install attempt $attempt failed; restarting adb before retry..."
              adb kill-server || true
              sleep 3
              adb start-server
              adb wait-for-device
              sleep 8
            done
            test "$installed" = "1"
            echo "Launching app..."
            adb shell am force-stop ir.elambar.mobl
            adb shell monkey -p ir.elambar.mobl 1
            sleep 12
            echo "Checking app process..."
            APP_PID=$(adb shell pidof ir.elambar.mobl | tr -d '\r')
            test -n "$APP_PID"
            echo "Checking foreground activity..."
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -n 2
            echo "Checking app-specific fatal crashes..."
            if adb logcat -d --pid="$APP_PID" | grep -q "FATAL EXCEPTION"; then
              adb logcat -d --pid="$APP_PID" | grep -A 30 -B 5 "FATAL EXCEPTION"
              exit 1
            fi
