name: Android APK
on:
  push:
    branches: [ "main", "stable/base-run-165", "work/source-166", "work/source-184", "work/source-185", "work/source-186", "work/release-hardening-1.0.22", "fix/driver-available-loads-filter", "design/tarp-truck-menu-v1-0-24", "feature/confirmed-user-rules-v1-0-25", "fix/source-343-stabilization", "stable/source-343-baseline", "fix/post-merge-ci-stabilization", "feature/v1.5.1-load-draft-autosave", "release/v1.5.1-clean-candidate", "fix/load-status-edit-delete-logout-v1", "feature/company-panel-v2-isolated", "feature/company-panel-v2-install-safe", "diagnostic/startup-crash-log-v1" ]
    paths:
      - "app/**"
      - "supabase/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [ "fix/load-status-edit-delete-logout-v1" ]
    paths:
      - "app/**"
      - "supabase/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: android-debug-keystore-v3-Linux

      - name: Create stable debug signing key when cache is empty
        shell: bash
        run: |
          mkdir -p /home/runner/.android
          if [ ! -s /home/runner/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore /home/runner/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s /home/runner/.android/debug.keystore

      - name: Verify package identity and version
        shell: bash
        run: |
          grep -F 'applicationId = "ir.elambar.mobl"' app/build.gradle.kts
          grep -F 'versionCode = 37' app/build.gradle.kts
          grep -F 'versionName = "1.6.1"' app/build.gradle.kts
          awk '/^[[:space:]]*PREPARE_JSON=/ && /versionCode:37,versionName:"1.6.1"/ { found=1 } END { exit !found }' .github/workflows/android-apk.yml
          awk '/^[[:space:]]*FINALIZE_JSON=/ && /versionCode:37,versionName:"1.6.1"/ { found=1 } END { exit !found }' .github/workflows/android-apk.yml
          ! grep -E 'ELAM_TURN_(URL|USERNAME|PASSWORD)' .github/workflows/android-apk.yml

      - name: Build debug APK (retry transient Maven errors)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if gradle --no-daemon --max-workers=2 assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting before retry in case Maven Central is rate-limiting requests."
              sleep $((attempt * 20))
            fi
          done
          echo "Gradle build failed after three attempts."
          exit 1

      - name: Re-sign APK with the persistent CI key
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIGNED=app/build/outputs/apk/debug/app-debug-signed.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /home/runner/.android/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" "$APK"
          mv "$SIGNED" "$APK"

      - name: Verify APK was produced
        shell: bash
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK package metadata and signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='ir.elambar.mobl' versionCode='37' versionName='1.6.1'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs --verbose "$APK"
          keytool -list -v -keystore /home/runner/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:"
          sha256sum "$APK"
          du -h "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elam-bar-mobl-v1.6.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to public update storage using GitHub OIDC
        # PR validation builds must never publish to the public update channel.
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/load-status-edit-delete-logout-v1'
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          ARCHIVE=app/build/outputs/apk/debug/app-release.zip
          zip -9 -j "$ARCHIVE" "$APK"
          ARCHIVE_SIZE=$(stat -c%s "$ARCHIVE")
          if [ "$ARCHIVE_SIZE" -ge 50000000 ]; then
            echo "Compressed release archive exceeds the Supabase Free file upload limit."
            exit 1
          fi
          get_oidc_token() {
            local token_json
            token_json=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=elambar-release-upload")
            echo "$token_json" | jq -r '.value'
          }

          OIDC_TOKEN=$(get_oidc_token)
          PREPARE_JSON=$(jq -n '{action:"prepare",versionCode:37,versionName:"1.6.1"}')
          PREPARE_RESULT=$(curl -fsS -X POST "https://sckcxtceybwtiecyxqsy.supabase.co/functions/v1/app-release-upload" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PREPARE_JSON")
          SIGNED_URL=$(echo "$PREPARE_RESULT" | jq -r '.signedUrl')
          test -n "$SIGNED_URL" && test "$SIGNED_URL" != "null"

          curl -fsS -X PUT "$SIGNED_URL" \
            -H "Content-Type: application/zip" \
            -H "x-upsert: true" \
            --data-binary "@$ARCHIVE"

          ARCHIVE_SHA256=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          OIDC_TOKEN=$(get_oidc_token)
          FINALIZE_JSON=$(jq -n --arg archiveSha256 "$ARCHIVE_SHA256" --arg apkSha256 "$APK_SHA256" '{action:"finalize",versionCode:37,versionName:"1.6.1",archiveSha256:$archiveSha256,apkSha256:$apkSha256}')
          curl -fsS -X POST "https://sckcxtceybwtiecyxqsy.supabase.co/functions/v1/app-release-upload" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$FINALIZE_JSON"

  emulator-smoke-test:
    name: Optional emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: elam-bar-mobl-v1.6.1-debug-apk
          path: artifacts

      - name: Install and launch APK on Android emulator
        timeout-minutes: 24
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2 -no-snapshot -no-metrics
          emulator-boot-timeout: 1200
          disable-animations: true
          script: |
            set +e
            echo "Waiting for Android device..."
            adb wait-for-device
            echo "Waiting for Android package manager..."
            ready=0
            for i in $(seq 1 24); do
              if timeout 10s adb shell pm list packages >/dev/null 2>&1; then ready=1; break; fi
              echo "Package manager not ready ($i/24)"
              sleep 5
            done
            if [ "$ready" -ne 1 ]; then
              echo "Android package manager did not become ready."
              adb logcat -d -v threadtime | tail -n 500
              exit 1
            fi
            echo "Installing APK..."
            timeout 180s adb install -r artifacts/app-debug.apk
            install_rc=$?
            if [ "$install_rc" -ne 0 ]; then
              echo "APK install failed with exit code $install_rc"
              adb logcat -d -v threadtime | tail -n 500
              exit "$install_rc"
            fi
            adb logcat -c
            echo "Starting app explicitly and waiting for launch result..."
            timeout 45s adb shell am force-stop ir.elambar.mobl
            timeout 60s adb shell am start -W -n ir.elambar.mobl/.MainActivity
            launch_rc=$?
            echo "Activity launch exit code: $launch_rc"
            sleep 20
            echo "===== APP PROCESS ====="
            adb shell pidof ir.elambar.mobl
            process_rc=$?
            echo "Process check exit code: $process_rc"
            echo "===== FOREGROUND ACTIVITY ====="
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -n 4
            echo "===== APP CRASH LOG (if any) ====="
            adb logcat -d -v threadtime | grep -E -A 45 -B 8 "FATAL EXCEPTION|AndroidRuntime|Process: ir.elambar.mobl|ir.elambar.mobl.*(Fatal|Exception)" | tail -n 250
            crash_rc=$?
            echo "Crash-log grep exit code: $crash_rc"
            echo "===== RECENT LOGCAT ====="
            adb logcat -d -v threadtime -t 400 | tail -n 400
            if [ "$launch_rc" -ne 0 ] || [ "$process_rc" -ne 0 ] || [ "$crash_rc" -eq 0 ]; then
              echo "Startup smoke test failed; diagnostic logs were printed above."
              exit 1
            fi
            echo "Startup smoke test passed: process is alive and no fatal crash was found."
# Emulator smoke-test script captures launch status and logcat even when launch fails.
